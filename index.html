<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HabitPal">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>HabitPal</title>
<style>
:root{--paper:#eaf6ff;--ink:#1b1b3a;--grape:#7a5cff;--pink:#ff6fa5;--sun:#ffd23f;--mint:#3ddc97;--white:#fff;--muted:#5f6088}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Trebuchet MS",system-ui,sans-serif;font-weight:700}
body{padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px);max-width:560px;margin:0 auto}
h1{font-size:30px;margin:0;line-height:1.1}
h2{font-size:20px;margin:22px 0 10px}
small,.muted{color:var(--muted);font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.daynav{display:flex;align-items:center;gap:8px}
.btn{font:inherit;border:2.5px solid var(--ink);background:var(--white);color:var(--ink);border-radius:14px;padding:10px 14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.primary{background:var(--grape);color:#fff}
.btn.danger{background:var(--pink)}
.btn.sm{padding:6px 10px;border-radius:10px;box-shadow:0 3px 0 var(--ink)}
.card{background:var(--white);border:2.5px solid var(--ink);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--ink);margin-bottom:16px}
.hero{background:var(--sun)}
.bar{height:16px;border:2.5px solid var(--ink);border-radius:99px;background:var(--white);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--grape);transition:width .3s}
.habit{display:flex;align-items:center;gap:12px;background:var(--white);border:2.5px solid var(--ink);border-radius:20px;padding:12px;margin-bottom:14px;box-shadow:0 5px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .15s;user-select:none}
.habit .emoji{width:48px;height:48px;border:2.5px solid var(--ink);border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--c)}
.habit .info{flex:1;min-width:0}
.habit .info b{display:block;font-size:17px;overflow-wrap:anywhere}
.habit .check{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:22px;color:transparent;background:var(--white)}
.habit.done{transform:translateY(5px);box-shadow:0 0 0 var(--ink);background:#e9fff5}
.habit.done .check{background:var(--mint);color:var(--ink)}
.habit.done .info b{text-decoration:line-through;text-decoration-thickness:2px}
textarea,input[type=text]{width:100%;font:inherit;font-weight:600;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--white);color:var(--ink)}
textarea{resize:none;height:80px}
textarea:focus,input:focus{outline:3px solid var(--grape);outline-offset:2px}
label{display:block;margin:0 0 6px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.pick{font-size:22px;padding:4px 8px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--paper);border-top:2.5px solid var(--ink)}
.nav .btn{flex:1;max-width:170px;text-align:center}
.nav .btn.on{background:var(--grape);color:#fff}
.dots{display:flex;gap:6px}
.dotcol{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.dot{width:24px;height:24px;border:2.5px solid var(--ink);border-radius:50%;background:var(--white)}
.dot.on{background:var(--c)}
.stat{display:flex;gap:10px}
.stat>div{flex:1;border:2.5px solid var(--ink);border-radius:16px;padding:10px;background:var(--white)}
.stat b{display:block;font-size:26px}
.empty{text-align:center;padding:24px 8px}
.empty .big{font-size:48px}
.note{border-left:5px solid var(--grape);padding:2px 0 2px 10px;margin:8px 0}
.pop{position:fixed;font-size:28px;pointer-events:none;z-index:99;animation:pop 1s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.pop{display:none}.habit,.btn,.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav">
  <button class="btn on" data-view="today">Today</button>
  <button class="btn" data-view="week">Week</button>
  <button class="btn" data-view="habits">Habits</button>
</div>
<script>
const KEY='habitpal.v1';
const COLORS=['#b9a8ff','#ffa8cb','#ffc27a','#8be9bf','#8fd3ff','#ffe27a'];
const EMOJIS=['💧','📖','🏃','🧘','😴','🥗','💻','✍️','🎯','🦷','🕌','🧹'];
const z=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>fmt(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.habits))return d}catch(e){}
  return {habits:[
    {id:'h1',name:'Drink water',emoji:'💧',color:COLORS[4]},
    {id:'h2',name:'Read 10 pages',emoji:'📖',color:COLORS[0]},
    {id:'h3',name:'Move my body',emoji:'🏃',color:COLORS[3]}
  ],logs:{}};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let view='today',cur=today(),editing=null;

const isDone=(id,d)=>!!(S.logs[d]&&S.logs[d].done.includes(id));
function dayLog(d){if(!S.logs[d])S.logs[d]={done:[],note:''};return S.logs[d]}
function streak(id){
  let d=today();if(!isDone(id,d))d=addDays(d,-1);
  let n=0;while(isDone(id,d)){n++;d=addDays(d,-1)}return n;
}
function bestStreak(id){
  const ds=Object.keys(S.logs).filter(k=>isDone(id,k)).sort();
  let best=0,run=0,prev=null;
  for(const k of ds){run=(prev&&addDays(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k}
  return best;
}

function viewToday(){
  const hs=S.habits,l=S.logs[cur]||{done:[],note:''};
  const n=hs.filter(h=>l.done.includes(h.id)).length;
  const pct=hs.length?Math.round(n/hs.length*100):0;
  const label=cur===today()?'Today':parse(cur).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
  const msg=!hs.length?'Add your first habit':pct===100?'Perfect day! 🎉':pct>=50?'Over halfway, keep going! 💪':'You\u2019ve got this! 🌱';
  let h=`<div class="top"><h1>${esc(label)}</h1><div class="daynav">
    <button class="btn sm" data-day="-1" aria-label="Previous day">◀</button>
    <button class="btn sm" data-day="1" aria-label="Next day" ${cur>=today()?'disabled':''}>▶</button></div></div>
    <div class="card hero"><div class="row" style="justify-content:space-between"><span>${esc(msg)}</span><span>${n}/${hs.length}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div></div>`;
  if(!hs.length)h+=`<div class="card empty"><div class="big">🌱</div><p>No habits yet.</p><button class="btn primary" data-view="habits">Add a habit</button></div>`;
  hs.forEach(x=>{
    const s=streak(x.id);
    h+=`<div class="habit ${l.done.includes(x.id)?'done':''}" data-toggle="${x.id}" role="checkbox" aria-checked="${l.done.includes(x.id)}">
      <div class="emoji" style="--c:${x.color}">${esc(x.emoji)}</div>
      <div class="info"><b>${esc(x.name)}</b><small>${s?'🔥 '+s+' day'+(s>1?'s':'')+' in a row':'Start a streak today'}</small></div>
      <div class="check">✓</div></div>`;
  });
  h+=`<h2>Note for the day</h2><textarea id="note" maxlength="200" placeholder="How did it go? (short note)">${esc(l.note)}</textarea>`;
  return h;
}

function viewWeek(){
  const days=[6,5,4,3,2,1,0].map(i=>addDays(today(),-i));
  const hs=S.habits;
  let total=0;hs.forEach(x=>days.forEach(d=>{if(isDone(x.id,d))total++}));
  const pct=hs.length?Math.round(total/(hs.length*7)*100):0;
  let top=null,topN=-1,hot=null,hotN=0;
  hs.forEach(x=>{const c=days.filter(d=>isDone(x.id,d)).length;if(c>topN){topN=c;top=x}const s=streak(x.id);if(s>hotN){hotN=s;hot=x}});
  let h=`<div class="top"><h1>This week</h1></div>
   <div class="card hero"><div class="row" style="justify-content:space-between"><span>Weekly score</span><span>${pct}%</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  if(!hs.length)return h+`<div class="card empty"><div class="big">📊</div><p>Add habits to see your week.</p></div>`;
  h+=`<div class="stat"><div><small>Best habit</small><b>${topN>0?esc(top.emoji):'–'}</b><small>${topN>0?esc(top.name)+' ('+topN+'/7)':'Nothing yet'}</small></div>
   <div><small>Longest streak</small><b>${hotN?'🔥 '+hotN:'–'}</b><small>${hotN?esc(hot.name):'Start today'}</small></div></div>`;
  h+=`<h2>Day by day</h2>`;
  hs.forEach(x=>{
    const c=days.filter(d=>isDone(x.id,d)).length;
    h+=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><span>${esc(x.emoji)} ${esc(x.name)}</span><span>${c}/7</span></div><div class="dots" style="--c:${x.color}">`+
    days.map(d=>`<div class="dotcol"><div class="dot ${isDone(x.id,d)?'on':''}"></div>${parse(d).toLocaleDateString(undefined,{weekday:'narrow'})}</div>`).join('')+`</div>
    <small>Best streak ever: ${bestStreak(x.id)}</small></div>`;
  });
  const notes=days.filter(d=>S.logs[d]&&S.logs[d].note.trim()).reverse();
  if(notes.length){h+=`<h2>Notes</h2><div class="card">`+notes.map(d=>`<div class="note"><small>${parse(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</small><div>${esc(S.logs[d].note)}</div></div>`).join('')+`</div>`}
  return h;
}

function viewHabits(){
  const e=S.habits.find(x=>x.id===editing);
  let h=`<div class="top"><h1>My habits</h1></div>
  <div class="card"><label for="hName">${e?'Edit habit':'New habit'}</label>
   <input type="text" id="hName" maxlength="40" placeholder="e.g. Practice Python" value="${e?esc(e.name):''}">
   <label for="hEmoji" style="margin-top:10px">Emoji</label>
   <input type="text" id="hEmoji" maxlength="4" value="${e?esc(e.emoji):'⭐'}">
   <div class="row wrap" style="margin:10px 0">${EMOJIS.map(m=>`<button class="btn sm pick" data-emoji="${m}">${m}</button>`).join('')}</div>
   <div class="row"><button class="btn primary" data-save>${e?'Save changes':'Add habit'}</button>${e?'<button class="btn" data-cancel>Cancel</button>':''}</div></div>`;
  S.habits.forEach(x=>{
    h+=`<div class="card"><div class="row"><div style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(x.emoji)} ${esc(x.name)}</div>
     <button class="btn sm" data-edit="${x.id}" aria-label="Edit">✏️</button>
     <button class="btn sm danger" data-del="${x.id}" aria-label="Delete">🗑️</button></div></div>`;
  });
  h+=`<h2>Backup</h2><div class="card"><small>Your data lives on this phone. Save a backup file now and then.</small>
   <div class="row wrap" style="margin-top:10px"><button class="btn" data-export>Save backup</button>
   <button class="btn" data-import>Restore backup</button></div>
   <input type="file" id="file" accept="application/json" hidden></div>`;
  return h;
}

function render(){
  document.getElementById('app').innerHTML=view==='today'?viewToday():view==='week'?viewWeek():viewHabits();
  document.querySelectorAll('.nav .btn').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
}
function go(v){view=v;editing=null;render();window.scrollTo(0,0)}

function burst(){
  const em=['🎉','⭐','✨','🔥','💜'];
  for(let i=0;i<14;i++){
    const s=document.createElement('span');s.className='pop';s.textContent=em[i%em.length];
    s.style.left='50%';s.style.top='40%';
    s.style.setProperty('--dx',(Math.random()*320-160)+'px');
    s.style.setProperty('--dy',(Math.random()*-260-40)+'px');
    s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-toggle]');if(!t)return;
  const d=t.dataset;
  if(d.view){go(d.view)}
  else if(d.day){const n=addDays(cur,Number(d.day));if(n<=today()){cur=n;render()}}
  else if(d.toggle){
    const l=dayLog(cur),i=l.done.indexOf(d.toggle);
    if(i>-1)l.done.splice(i,1);else l.done.push(d.toggle);
    save();render();
    if(i===-1&&S.habits.length&&S.habits.every(x=>l.done.includes(x.id)))burst();
  }
  else if(d.emoji){document.getElementById('hEmoji').value=d.emoji}
  else if('save' in d){
    const name=document.getElementById('hName').value.trim();
    const emoji=document.getElementById('hEmoji').value.trim()||'⭐';
    if(!name){document.getElementById('hName').focus();return}
    if(editing){const x=S.habits.find(y=>y.id===editing);x.name=name;x.emoji=emoji}
    else S.habits.push({id:'h'+Date.now(),name,emoji,color:COLORS[S.habits.length%COLORS.length]});
    editing=null;save();render();
  }
  else if('cancel' in d){editing=null;render()}
  else if(d.edit){editing=d.edit;render();window.scrollTo(0,0)}
  else if(d.del){
    const x=S.habits.find(y=>y.id===d.del);
    if(confirm('Delete "'+x.name+'"? Its history will be removed too.')){
      S.habits=S.habits.filter(y=>y.id!==d.del);
      Object.values(S.logs).forEach(l=>{l.done=l.done.filter(i=>i!==d.del)});
      save();render();
    }
  }
  else if('export' in d){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    a.download='habitpal-backup-'+today()+'.json';a.click();
  }
  else if('import' in d){document.getElementById('file').click()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='note'){dayLog(cur).note=e.target.value;save()}
});
document.addEventListener('change',e=>{
  if(e.target.id!=='file'||!e.target.files[0])return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.habits)||typeof d.logs!=='object')throw 0;
      if(confirm('Replace everything on this phone with the backup?')){S=d;save();render()}
    }catch(x){alert('That file is not a HabitPal backup.')}
  };
  r.readAsText(e.target.files[0]);
});

render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
